name: NoliKorea Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python scripts/package-release.py --archive NoliKorea_V5_FULL.zip
      - run: gh release create "$GITHUB_REF_NAME" NoliKorea_V5_FULL.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
