name: Deploy NoliKorea to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'NoliKorea_V7_Part1.zip'
      - 'NoliKorea_V7_Part2.zip'
      - 'NoliKorea_V7_Update.zip'
      - 'NoliKorea_V8_Update.zip'
      - 'NoliKorea_V8_Update_02.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked site
          unzip -oq NoliKorea_V7_Part1.zip -d unpacked
          unzip -oq NoliKorea_V7_Part2.zip -d unpacked
          if [ -f NoliKorea_V8_Update_02.zip ]; then
            unzip -oq NoliKorea_V8_Update_02.zip -d update
            test -f update/v7/dist/index.html
            test -d unpacked/v7/dist/audio
            cp -a unpacked/v7/dist/audio site/
            cp -a update/v7/dist/. site/
            test -f site/audio/tts-1a-map.js
          elif [ -f NoliKorea_V8_Update.zip ]; then
            unzip -oq NoliKorea_V8_Update.zip -d update
            test -f update/v7/dist/index.html
            test -d unpacked/v7/dist/audio
            cp -a unpacked/v7/dist/audio site/
            cp -a update/v7/dist/. site/
            test -f site/audio/tts-1a-map.js
          elif [ -f NoliKorea_V7_Update.zip ]; then
            unzip -oq NoliKorea_V7_Update.zip -d update
            test -f update/v7/dist/index.html
            cp -a unpacked/v7/dist/audio site/
            cp -a update/v7/dist/. site/
          else
            cp -a unpacked/v7/dist/. site/
          fi
          test -f site/index.html
          touch site/.nojekyll
          echo "Site files: $(find site -type f | wc -l)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
