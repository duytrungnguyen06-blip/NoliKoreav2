name: Deploy NoliKorea to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'NoliKorea_V7_Part1.zip'
      - 'NoliKorea_V7_Part2.zip'
      - 'NoliKorea_V7_Update.zip'
      - 'NoliKorea_V8_Update.zip'
      - 'NoliKorea_V8_Update_02.zip'
      - 'NoliKorea_V8_Update_03_Part1.zip'
      - 'NoliKorea_V8_Update_03_Part2.zip'
      - 'NoliKorea_V8_Update_04_Part1.zip'
      - 'NoliKorea_V8_Update_04_Part2.zip'
      - 'NoliKorea_V8_Update_04_Part3.zip'
      - 'NoliKorea_V8_Update_05.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked site
          unzip -oq NoliKorea_V7_Part1.zip -d unpacked
          unzip -oq NoliKorea_V7_Part2.zip -d unpacked
          if [ -f NoliKorea_V8_Update_04_Part1.zip ] || [ -f NoliKorea_V8_Update_04_Part2.zip ] || [ -f NoliKorea_V8_Update_04_Part3.zip ]; then
            mkdir -p shared update site/audio
            for part in 1 2; do
              unzip -oq "NoliKorea_V8_Update_03_Part${part}.zip" -d shared
            done
            for part in 1 2 3; do
              test -f "NoliKorea_V8_Update_04_Part${part}.zip"
              unzip -oq "NoliKorea_V8_Update_04_Part${part}.zip" -d update
            done
            cp -a unpacked/v7/dist/audio/snu1a site/audio/
            cp -a shared/v7/dist/audio/tts_1a shared/v7/dist/audio/tts_1a_male site/audio/
            cp -a update/v7/dist/. site/
            test -f site/workbook.js
            test -d site/audio/snu1a_wb
            (cd site && sha256sum --quiet -c ../update/site-sha256.txt)
            test "$(find site -type f | wc -l)" -eq 2485
          elif [ -f NoliKorea_V8_Update_03_Part1.zip ] || [ -f NoliKorea_V8_Update_03_Part2.zip ]; then
            test -f NoliKorea_V8_Update_03_Part1.zip
            test -f NoliKorea_V8_Update_03_Part2.zip
            unzip -oq NoliKorea_V8_Update_03_Part1.zip -d update
            unzip -oq NoliKorea_V8_Update_03_Part2.zip -d update
            test -f update/v7/dist/index.html
            mkdir -p site/audio
            cp -a unpacked/v7/dist/audio/snu1a site/audio/
            cp -a update/v7/dist/. site/
            (cd site && sha256sum --quiet -c ../update/site-sha256.txt)
            test "$(find site -type f | wc -l)" -eq 2431
          elif [ -f NoliKorea_V8_Update_02.zip ]; then
            unzip -oq NoliKorea_V8_Update_02.zip -d update
            test -f update/v7/dist/index.html
            test -d unpacked/v7/dist/audio
            cp -a unpacked/v7/dist/audio site/
            cp -a update/v7/dist/. site/
            test -f site/audio/tts-1a-map.js
          elif [ -f NoliKorea_V8_Update.zip ]; then
            unzip -oq NoliKorea_V8_Update.zip -d update
            test -f update/v7/dist/index.html
            test -d unpacked/v7/dist/audio
            cp -a unpacked/v7/dist/audio site/
            cp -a update/v7/dist/. site/
            test -f site/audio/tts-1a-map.js
          elif [ -f NoliKorea_V7_Update.zip ]; then
            unzip -oq NoliKorea_V7_Update.zip -d update
            test -f update/v7/dist/index.html
            cp -a unpacked/v7/dist/audio site/
            cp -a update/v7/dist/. site/
          else
            cp -a unpacked/v7/dist/. site/
          fi
          if [ -f NoliKorea_V8_Update_05.zip ]; then
            mkdir -p patch05
            unzip -oq NoliKorea_V8_Update_05.zip -d patch05
            cp -a patch05/v7/dist/. site/
            (cd site && sha256sum --quiet -c ../patch05/site-sha256.txt)
            test "$(find site -type f | wc -l)" -eq 2485
          fi
          test -f site/index.html
          touch site/.nojekyll
          echo "Site files: $(find site -type f | wc -l)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
